<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Pedidos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4">Lista de Pedidos</h1>

    <!-- Tabla para mostrar la lista de pedidos -->
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Descripción</th>
            <th>Cliente</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <!-- Thymeleaf recorre la lista de pedidos y genera una fila por cada uno -->
        <tr th:each="pedido : ${pedidos}">
            <form th:action="@{/pedidos/actualizar}" method="post">
                <td th:text="${pedido.id}"></td>

                <input type="hidden" name="id" th:value="${pedido.id}"/>

                <td>
                    <input type="text" name="titulo"
                           th:value="${pedido.titulo}"
                           class="form-control">
                </td>

                <td>
                    <input type="text" name="descripcion"
                           th:value="${pedido.descripcion}"
                           class="form-control">
                </td>

                <td th:text="${pedido.cliente.nombre}"></td>

                <td>
                    <button class="btn btn-success btn-sm">Actualizar</button>
                    <a th:href="@{/pedidos/eliminar(id=${pedido.id})}"
                       class="btn btn-danger btn-sm">Eliminar</a>
                </td>
            </form>
        </tr>
        </tbody>
    </table>

    <h2 class="mt-4">Agregar Pedido</h2>
    <form action="/pedidos/guardar" method="post">
        <div class="mb-3">
            <label for="titulo" class="form-label">Título</label>
            <input type="text" class="form-control" id="titulo" name="titulo" required>
        </div>
        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea class="form-control" id="descripcion" name="descripcion" required></textarea>
        </div>
        <div class="mb-3">
            <label for="cliente" class="form-label">Cliente</label>
            <!-- Select para elegir un cliente -->
            <select class="form-control" id="cliente" name="clienteId" required>
                <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.nombre}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
    </form>

</div>
</body>
</html>
