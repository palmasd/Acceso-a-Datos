<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Clientes</title>
    <!-- Incluimos Bootstrap para estilos bonitos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4">Lista de Clientes</h1>

    <!-- Tabla para mostrar la lista de clientes -->
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <!-- Thymeleaf recorre la lista de clientes y genera una fila por cada uno -->
        <tr th:each="cliente : ${clientes}">
            <form th:action="@{/clientes/actualizar}" method="post">
                <td th:text="${cliente.id}"></td>
                <td>
                    <input type="text"
                           name="nombre"
                           class="form-control"
                           th:value="${cliente.nombre}"/>
                </td>
                <td>
                    <input type="email"
                           name="email"
                           class="form-control"
                           th:value="${cliente.email}"/>
                </td>
                <td>
                    <input type="hidden" name="id" th:value="${cliente.id}"/>
                    <button type="submit" class="btn btn-success btn-sm">Actualizar</button>
                    <a th:href="@{/clientes/eliminar(id=${cliente.id})}"
                       class="btn btn-danger btn-sm">
                        Eliminar
                    </a>
                </td>
            </form>
        </tr>
        </tbody>
    </table>

    <h2 class="mt-4">Agregar Cliente</h2>
    <!-- Formulario para agregar un nuevo cliente -->
    <form action="/clientes/guardar" method="post">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" name="nombre" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
    </form>
</div>
</body>
</html>
